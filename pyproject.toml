[project]
name = "irpf-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-llms-google-genai>=0.11.3",
    "llama-index-vector-stores-chroma>=0.6.0",
    "llama-index-vector-stores-pinecone>=0.9.0",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
